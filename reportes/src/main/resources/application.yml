spring:
  application:
    name: comercio-reportes

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:comercio_reportes}
    username: ${DB_USER:comercio}
    password: ${DB_PASSWORD:comercio}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: comercio-reportes
      # earliest: un consumidor nuevo procesa todo el historial en lugar de arrancar
      # desde el final. La proyeccion se reconstruye sola, y los duplicados los descarta
      # la tabla evento_procesado.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      # El offset se confirma despues de que el listener termina bien. Con la proyeccion
      # y la marca de procesado en la misma transaccion, un fallo deja el offset sin
      # avanzar y el evento se reintenta.
      ack-mode: record

server:
  port: ${PORT:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    dev.francogomez.comercio: INFO
