services:
  postgres-core:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: comercio_core
      POSTGRES_USER: comercio
      POSTGRES_PASSWORD: comercio
    ports:
      - "5432:5432"
    volumes:
      - postgres-core-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comercio -d comercio_core"]
      interval: 5s
      timeout: 5s
      retries: 10

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    environment:
      DB_HOST: postgres-core
      DB_PORT: 5432
      DB_NAME: comercio_core
      DB_USER: comercio
      DB_PASSWORD: comercio
    ports:
      - "8080:8080"
    depends_on:
      postgres-core:
        condition: service_healthy

volumes:
  postgres-core-data:
