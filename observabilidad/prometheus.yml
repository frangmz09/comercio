global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: comercio-core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["core:8080"]
        labels:
          servicio: core

  - job_name: comercio-reportes
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["reportes:8082"]
        labels:
          servicio: reportes
