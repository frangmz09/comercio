spring:
  application:
    name: comercio-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:comercio_core}
    username: ${DB_USER:comercio}
    password: ${DB_PASSWORD:comercio}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway, Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

logging:
  level:
    dev.francogomez.comercio: INFO
