# Las comillas son necesarias: YAML reserva '@' al inicio de un escalar plano.
# spring-boot-starter-parent filtra este archivo y reemplaza el token por la version del pom.
app:
  version: '@project.version@'

spring:
  application:
    name: comercio-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:comercio_core}
    username: ${DB_USER:comercio}
    password: ${DB_PASSWORD:comercio}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway, Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # acks=all: el broker confirma recién cuando las réplicas in-sync escribieron. Sin
      # esto, el publisher marcaría el evento como publicado ante una promesa que Kafka
      # todavía puede romper.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000

comercio:
  jwt:
    # El valor por defecto solo sirve para desarrollo local. En cualquier despliegue se
    # sobreescribe con COMERCIO_JWT_SECRET: un secreto versionado en el repositorio es
    # equivalente a no tener firma. Minimo 32 caracteres, que es lo que exige HS256.
    secret: ${COMERCIO_JWT_SECRET:desarrollo-local-secreto-de-32-caracteres-minimo}
    # Corta a proposito: un token emitido no se puede revocar, asi que la expiracion es
    # el unico limite real de su validez.
    vigencia-minutos: ${COMERCIO_JWT_VIGENCIA_MINUTOS:60}

  demo:
    # Crea admin/vendedor al arrancar si no existen. Se apaga en un sistema real.
    seed-usuarios: ${COMERCIO_DEMO_SEED_USUARIOS:true}

  outbox:
    enabled: true
    # Cada cuánto se vacía el outbox. Un segundo mantiene la proyección de reportes
    # fresca sin castigar la base con consultas vacías.
    intervalo-ms: 1000

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true

logging:
  level:
    dev.francogomez.comercio: INFO
