name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # El contexto `secrets` no esta disponible en el `if` de un step, pero `env` si:
    # subirlo a nivel de job es lo que permite saltear Sonar cuando el token no esta cargado.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita historia completa para el analisis de nuevo codigo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Cache separada para el scanner de Sonar (no la gestiona el cache de maven de arriba)
      - uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, tests unitarios y de integracion (Testcontainers), cobertura
        run: ./mvnw -B verify

      # continue-on-error: el analisis es un informe, no una compuerta de merge. Que el
      # build compile y los tests pasen es una afirmacion sobre el codigo; que SonarCloud
      # este disponible y el token siga vigente son condiciones de un servicio externo.
      # Mezclarlas hace que una caida ajena deje el repositorio en rojo, y un badge rojo
      # que en realidad no significa nada roto es peor que no tener badge.
      - name: Analisis SonarCloud
        id: sonar
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B sonar:sonar

      # Sin este paso, continue-on-error deja el fallo completamente mudo: el step figura
      # como success en la API y en la interfaz, y el analisis puede estar roto durante
      # semanas sin que nadie se entere. La falla no debe frenar el merge, pero tiene que
      # verse. El aviso queda en el resumen del run, no perdido en el log.
      - name: Avisar si el analisis no corrio
        if: steps.sonar.outcome == 'failure'
        run: |
          {
            echo "### ⚠️ El analisis de SonarCloud fallo"
            echo ""
            echo "El build y los tests pasaron; lo que fallo fue el analisis."
            echo "Las metricas del dashboard quedan desactualizadas hasta que se resuelva."
            echo ""
            echo "Causa habitual: el **Analisis Automatico** esta activado en SonarCloud."
            echo "Mientras lo este, SonarCloud rechaza el analisis del CI, ignora la"
            echo "configuracion del pom y no puede leer la cobertura, porque no ejecuta"
            echo "el build. Se desactiva en Administration > Analysis Method."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/jacoco/
