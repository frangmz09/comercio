# Jenkins local para poder ejecutar el Jenkinsfile sin infraestructura propia.
#
#   docker compose -f docker-compose.jenkins.yml up
#
# Despues: http://localhost:8081, la clave inicial sale de
#   docker compose -f docker-compose.jenkins.yml exec jenkins \
#     cat /var/jenkins_home/secrets/initialAdminPassword
#
# Crear un job de tipo Pipeline > Pipeline script from SCM apuntando a este repositorio.
#
# El CI real del proyecto es GitHub Actions; esto existe para mostrar el mismo pipeline
# corriendo en Jenkins, no para mantener un servidor vivo.

services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    user: root # necesario para poder usar el socket de Docker del host
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      # El asistente inicial queda activo a proposito: es el que instala los plugins que
      # el pipeline necesita (Docker, Pipeline, el de cobertura). Saltearlo dejaria un
      # Jenkins que arranca pero no puede correr el Jenkinsfile.
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true
    volumes:
      - jenkins-home:/var/jenkins_home
      # Los tests de integracion levantan PostgreSQL y Kafka con Testcontainers, asi que
      # el agente necesita hablar con el daemon de Docker del host.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins-home:
